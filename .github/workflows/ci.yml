name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q -k "not df"  # classification-rule tests (no data needed)
      - name: Full-data tests (requires raw CSV — download from release)
        if: hashFiles('data/raw/APL_Logistics.csv') != ''
        run: |
          python scripts/01_clean_data.py
          python -m pytest tests/ -q
