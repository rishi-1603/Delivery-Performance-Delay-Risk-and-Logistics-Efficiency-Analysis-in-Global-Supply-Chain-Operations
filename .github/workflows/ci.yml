name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pipeline, tests & dashboard smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The 62.5 MB raw CSV is stored as a GitHub Release asset (tag: data-v1),
      # not in git — too large for dependable checkouts. CI pulls it here so
      # every test runs against the real, full dataset (no skips, no stubs).
      - name: Download dataset (Release asset)
        run: |
          mkdir -p data/raw
          curl -fSL --retry 3 --retry-delay 5 \
            -o data/raw/APL_Logistics.csv \
            "https://github.com/${{ github.repository }}/releases/download/data-v1/APL_Logistics.csv"

      - name: Run full pipeline (clean -> processed + reports)
        run: |
          python scripts/01_clean_data.py
          python scripts/02_analysis_report.py

      - name: Reports must regenerate byte-identical (determinism check)
        run: git diff --exit-code -- reports/

      - name: Run test suite (23 tests)
        run: python -m pytest tests/ -v

      - name: Dashboard smoke test (Streamlit AppTest)
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=300)
          at.run()
          assert not at.exception, f"Dashboard raised an exception: {at.exception}"
          print("Dashboard rendered end-to-end with no exceptions.")
          PY
